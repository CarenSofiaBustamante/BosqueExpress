<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BosqueExpress - Prototipo navegable</title>
<meta name="description" content="Prototipo navegable de BosqueExpress: pedidos anticipados con priorización por complejidad para los restaurantes universitarios de la Universidad El Bosque.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  ============================================================================
  BosqueExpress · Prototipo navegable (v2)
  Seminario de Investigación · Universidad El Bosque · Ingeniería de Sistemas
  ============================================================================
-->
<style>

:root{
  --g900:#0A3D3B; --g800:#0F4A47; --g700:#1B5A56; --g600:#2E6B5A; --g500:#4F8A78;
  --mint:#E4F0EC; --mint2:#DCE9E3; --cream:#FBFAF6; --page:#F2F0E9; --lane:#E8EAE4;
  --orange:#EF8A54; --orange-d:#D9682F; --peach:#FCE7D8; --amber:#F2C765;
  --sand:#FFF6E6; --sand2:#FFF2DD; --quedan:#FCF1DB;
  --ink:#10302E; --mute:#7C8C86; --line:#E9E7E0; --white:#fff;
  --err:#B42318; --errbg:#FDECEA;
  --f-body:"DM Sans","Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-head:"Bricolage Grotesque","DM Sans","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --chrome-h:60px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--f-body); color:var(--ink); background-color:#F1EFE6;
  background-image:linear-gradient(rgba(10,61,59,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(10,61,59,.045) 1px,transparent 1px);
  background-size:24px 24px; -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--orange);outline-offset:2px;border-radius:8px}
.ic{width:20px;height:20px;flex:none}
[hidden]{display:none!important}

.chrome{
  position:sticky;top:0;z-index:100;min-height:var(--chrome-h);display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:8px 20px;background:rgba(251,250,246,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand .logo{width:34px;height:34px;border-radius:11px;background:var(--g900);color:var(--amber);display:grid;place-items:center;font:700 17px var(--f-head)}
.brand b{display:block;font:600 15px var(--f-head);color:var(--g900);letter-spacing:-.01em}
.brand small{display:block;font-size:11px;color:var(--mute)}
.seg{display:inline-flex;background:var(--lane);padding:3px;border-radius:12px;gap:2px}
.seg button{padding:6px 12px;border-radius:9px;font-size:12.5px;font-weight:600;color:#5E6F69}
.seg button[aria-pressed="true"]{background:#fff;color:var(--g900);box-shadow:0 1px 3px rgba(10,61,59,.15)}
.ctl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12.5px;color:#4D5F59}
.ctl label{display:flex;align-items:center;gap:6px}
.ctl select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 6px}
.ctl .ghost{padding:6px 10px;border-radius:9px;border:1px solid #D9D6CB;background:#fff;font-weight:600;font-size:12.5px;color:var(--g900)}
.ctl .primary,.btn.primary{background:var(--orange);color:#fff;padding:7px 14px;border-radius:10px;font-weight:700;font-size:12.5px}
.ctl .primary:hover{background:var(--orange-d)}
.simhint{font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.testbar{display:none;align-items:center;gap:12px;font-size:12.5px;color:#4D5F59}
body[data-test="on"] .seg,body[data-test="on"] .ctl{display:none}
body[data-test="on"] .testbar{display:flex}

/* ============ ESCENARIO ============ */
.stage{display:flex;justify-content:center;align-items:flex-start;gap:40px;padding:22px 16px 40px}
.col{flex:none}
.col[hidden]{display:none}
.screen-label{display:flex;align-items:center;gap:10px;margin:0 0 10px 4px;font-size:15px;color:var(--g800);font-weight:500}
.screen-label .num{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--g700);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--g700);background:rgba(255,255,255,.6)}

.phone{
  position:relative;width:400px;height:840px;border:7px solid var(--g900);border-radius:50px;background:var(--cream);overflow:hidden;
  box-shadow:0 34px 60px -26px rgba(10,61,59,.45),0 0 0 1px rgba(10,61,59,.08);
}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--cream)}
.homebar{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:124px;height:4.5px;border-radius:4px;background:var(--g900);z-index:30;pointer-events:none}
.sb{height:40px;flex:none;padding:14px 26px 0;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.sb .sb-ic{display:flex;gap:5px;align-items:center}
.sb.light{color:#fff;position:relative;z-index:2}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 20px 28px;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}

/* --- Cabecera / menú --- */
.hd{display:flex;justify-content:space-between;align-items:flex-start;margin:6px 0 16px}
.eyebrow{font-size:10.5px;letter-spacing:.15em;color:#7E8F88;font-weight:700;text-transform:uppercase}
h1{font:600 27px/1.1 var(--f-head);letter-spacing:-.025em;color:var(--g900);margin-top:5px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--g900);flex:none}
.icon-btn:hover{background:var(--mint)}
.searchbar{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--g900);border-radius:14px;padding:0 12px;margin-bottom:12px;color:var(--g700)}
.searchbar input{flex:1;border:0;outline:0;padding:11px 0;font-size:14px;background:none}
.retiro{width:100%;display:flex;align-items:center;gap:12px;background:var(--g900);color:#fff;border-radius:18px;padding:13px 14px;text-align:left}
.retiro .tile{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.1);display:grid;place-items:center;color:#CFE3DB}
.retiro small{display:block;font-size:11px;color:#A9C7BE}
.retiro strong{display:block;font-size:15px;font-weight:700;margin-top:1px}
.retiro .grow{flex:1}
.retiro .chev{color:#8DB1A6}
.activechip{width:100%;display:flex;align-items:center;gap:10px;margin-top:10px;background:var(--mint);border:1px solid #CFE3DB;border-radius:16px;padding:10px 12px;text-align:left}
.activechip .dot{width:9px;height:9px;border-radius:50%;background:var(--orange);flex:none}
.activechip .dot.ready{background:#2E9E6A}
.activechip b{display:block;font-size:13px}
.activechip span{font-size:11.5px;color:#4D6A62}
.activechip .grow{flex:1}
.cats{display:flex;gap:8px;margin:16px 0 14px}
.cat{padding:8px 15px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;color:var(--ink)}
.cat[aria-selected="true"]{background:var(--g900);border-color:var(--g900);color:#fff}
.sec-hd{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 10px}
.sec-hd h2{font:600 19px var(--f-head);letter-spacing:-.015em;color:var(--g900)}
.sec-hd span{font-size:12px;color:var(--mute)}
.list{display:grid;gap:12px}
.card{
  display:grid;grid-template-columns:92px 1fr;min-height:104px;background:#fff;border:1px solid #ECE9E1;border-radius:18px;overflow:hidden;cursor:pointer;
  transition:box-shadow .15s,transform .15s;
}
.card:hover{box-shadow:0 6px 18px -8px rgba(10,61,59,.28)}
.card.is-out{cursor:default;opacity:.62}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.art{width:100%;height:100%;display:grid;place-items:center}
.art svg{width:76px;height:84px}
.art-almuerzo{background:#EAE5D5}.art-snack{background:#F6E7D0}.art-bebida{background:#DDEBE6}
.card .info{padding:11px 12px 11px 13px;display:flex;flex-direction:column;min-width:0}
.chip{align-self:flex-start;font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.01em}
.chip.ok{background:var(--mint);color:#2E7D5B}.chip.low{background:var(--quedan);color:#B7791F}.chip.out{background:#EFEDE8;color:#8A8A84}
.name{font:600 15px/1.2 var(--f-head);letter-spacing:-.01em;color:var(--g800);margin-top:6px;text-align:left}
.desc{font-size:11.5px;color:#8C9A94;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px}
.price{font-weight:700;font-size:14px;color:var(--g800)}
.add{width:32px;height:32px;border-radius:10px;background:var(--g900);color:#fff;display:grid;place-items:center}
.add:disabled{background:#C9CFCB;cursor:not-allowed}
.add .ic{width:17px;height:17px}
.step{display:flex;align-items:center;background:var(--g900);border-radius:11px;color:#fff}
.step button{width:30px;height:32px;display:grid;place-items:center;color:#fff}
.step .ic{width:15px;height:15px}
.step span{min-width:18px;text-align:center;font-weight:700;font-size:13px}
.skel{height:104px;border-radius:18px;background:linear-gradient(90deg,#EFEDE6 25%,#F8F6F0 50%,#EFEDE6 75%);background-size:200% 100%;animation:sh 1.1s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:34px 16px;color:var(--mute);font-size:13px}
.empty b{display:block;color:var(--g800);font:600 16px var(--f-head);margin:8px 0 4px}
.empty .ring{width:54px;height:54px;border-radius:50%;background:var(--mint);display:grid;place-items:center;margin:0 auto;color:var(--g700)}

.cartbar{position:absolute;left:14px;right:14px;bottom:76px;z-index:12;display:flex;align-items:center;gap:10px;background:var(--orange);color:#fff;border-radius:20px;padding:10px 16px 10px 10px;box-shadow:0 12px 24px -10px rgba(217,104,47,.7);text-align:left}
.cartbar .n{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.28);display:grid;place-items:center;font-weight:700;font-size:13px}
.cartbar b{flex:1;font-size:14px}
.cartbar strong{font-size:15px}
.nav{flex:none;height:70px;border-top:1px solid var(--line);background:var(--cream);display:flex;justify-content:space-around;padding:9px 18px 0;position:relative;z-index:13}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:#9AA6A1;width:70px;height:46px;position:relative}
.nav button[aria-current="page"]{color:var(--g900)}
.nav .badge{position:absolute;top:-1px;right:16px;width:9px;height:9px;border-radius:50%;background:var(--orange);border:2px solid var(--cream)}

/* --- Confirmar pedido --- */
.topbar{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;margin:4px 0 14px}
.topbar h2{text-align:center;font:600 17px var(--f-head);letter-spacing:-.01em;color:var(--g900)}
.hero-order{display:flex;align-items:center;gap:14px;background:var(--g900);border-radius:18px;padding:12px 14px;color:#fff}
.hero-order .tile{width:40px;height:40px;border-radius:12px;background:rgba(242,199,101,.16);color:var(--amber);display:grid;place-items:center;flex:none}
.hero-order .col2{padding-left:14px;border-left:1px solid rgba(255,255,255,.16)}
.hero-order small{display:block;font-size:9px;letter-spacing:.14em;color:#8FB5AA;font-weight:700}
.hero-order b{display:block;font-size:15px;margin-top:2px;font-variant-numeric:tabular-nums}
.receipt{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px 16px;margin-top:14px;box-shadow:0 4px 14px -10px rgba(10,61,59,.25)}
.receipt .hrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.receipt h3{font:600 17px var(--f-head);color:var(--g800)}
.link{color:var(--orange-d);font-weight:700;font-size:12.5px}
.row{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;margin:8px 0;color:#2D4A46}
.row .q{font-style:normal;color:#9AA6A1;margin-right:5px}
.row.mute{color:#98A6A0}
.row b{font-weight:700;color:var(--g900);white-space:nowrap}
.row .note{display:block;font-style:normal;font-size:10.5px;color:#B7791F;margin-top:1px}
.dash{border:0;border-top:1.5px dashed #DDDACF;margin:10px 0}
.row.total{font-size:14px;font-weight:700;align-items:center}
.row.total b{font:700 22px var(--f-head);color:var(--g900)}
.sec-line{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px}
.sec-line h3{font:600 17px var(--f-head);color:var(--g800)}
.tag{background:var(--peach);color:var(--orange-d);font-size:10px;font-weight:700;letter-spacing:.06em;padding:3px 9px;border-radius:7px}
.pay{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:1.5px solid #E8E5DC;background:#fff;margin-bottom:9px;text-align:left}
.pay .pi{width:38px;height:38px;border-radius:11px;background:var(--mint);color:var(--g700);display:grid;place-items:center;flex:none}
.pay b{display:block;font-size:13.5px}.pay small{display:block;font-size:11px;color:var(--mute);margin-top:1px}
.pay .grow{flex:1}
.radio{width:20px;height:20px;border-radius:50%;border:1.5px solid #CFCDC3;display:grid;place-items:center;flex:none}
.pay[aria-checked="true"]{border-color:var(--g900);background:#F6FAF7}
.pay[aria-checked="true"] .radio{border-color:var(--g900)}
.pay[aria-checked="true"] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--g900)}
.info-box{display:flex;gap:10px;align-items:flex-start;background:var(--sand);border-radius:14px;padding:11px 13px;margin-top:6px;color:#8A5A14}
.info-box .ic{color:#E0A33A;margin-top:1px;width:18px;height:18px}
.info-box b{display:block;font-size:11.5px}.info-box span{font-size:11.5px;color:#9A6B25}
.alert{display:flex;gap:10px;background:var(--errbg);color:var(--err);border:1px solid #F5C6C1;border-radius:14px;padding:11px 13px;margin:6px 0 10px;font-size:12.5px;line-height:1.4}
.alert .ic{flex:none;margin-top:1px;width:18px;height:18px}
.alert b{display:block}
.paybar{position:absolute;left:0;right:0;bottom:0;z-index:14;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px 24px;background:var(--cream);border-top:1px solid var(--line)}
.paybar small{display:block;font-size:10.5px;color:var(--mute)}
.paybar b{font:700 20px var(--f-head);color:var(--g900)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;font-weight:700;font-size:14.5px;padding:0 20px;height:50px}
.btn.dark{background:var(--g900);color:#fff}
.btn.dark:hover{background:var(--g800)}
.btn.dark:disabled{opacity:.55;cursor:wait}
.btn.light{background:#fff;color:var(--g900);border:1.5px solid #D7D4C9}
.btn.orange{background:var(--orange);color:#fff}
.btn.block{width:100%}
.paybar .btn{flex:1;max-width:190px}
.overlay{position:absolute;inset:0;z-index:60;background:rgba(251,250,246,.86);backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px}
.overlay b{font:600 18px var(--f-head);color:var(--g900)}.overlay span{font-size:12.5px;color:var(--mute)}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--mint2);border-top-color:var(--g900);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* --- Seguimiento --- */
.hero-track{background:var(--g900);color:#fff;border-radius:22px;padding:18px 18px 16px;position:relative;overflow:hidden}
.hero-track::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;border:1px solid rgba(255,255,255,.1)}
.hero-track .eyebrow{color:#8FB5AA}
.hero-track h2{font:600 24px/1.15 var(--f-head);letter-spacing:-.02em;margin:6px 0 4px}
.hero-track p{font-size:12.5px;color:#BCD6CD}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.14);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--amber);border-radius:6px;transition:width .5s}
.steps{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);margin:16px 0 4px;text-align:center}
.steps li{font-size:10.5px;font-weight:600;color:#9AA6A1;position:relative}
.steps li .b{width:26px;height:26px;border-radius:50%;background:#EDEBE3;color:#9AA6A1;display:grid;place-items:center;margin:0 auto 5px;position:relative;z-index:1}
.steps li.on{color:var(--g900)}.steps li.on .b{background:var(--g900);color:#fff}
.steps li.cur .b{background:var(--orange);color:#fff;box-shadow:0 0 0 5px rgba(239,138,84,.2)}
.steps li:not(:last-child)::after{content:"";position:absolute;top:12px;left:calc(50% + 15px);right:calc(-50% + 15px);height:2px;background:#E4E1D7}
.steps li.on:not(:last-child)::after{background:var(--g900)}
.steps .ic{width:14px;height:14px}
.plain{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px 15px;margin-top:12px}
.plain h3{font:600 14.5px var(--f-head);color:var(--g800);margin-bottom:6px}
.lane-note{display:flex;gap:10px;align-items:flex-start;font-size:12px;color:#4D6A62;line-height:1.4}
.lane-note .ic{color:var(--g600);margin-top:1px}
.pill{display:inline-block;font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.03em}
.pill.q{background:#FFF0C9;color:#8A5F00}.pill.f{background:var(--mint2);color:#2E6B5A}

/* --- Aviso de retiro (pantalla de bloqueo) --- */
.lock{background:radial-gradient(120% 55% at 50% 0%,#1F5652 0%,#0C433E 55%,#143E3A 100%);color:#fff;overflow:hidden}
.lock::before,.lock::after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.07);pointer-events:none}
.lock::before{width:330px;height:330px;left:-120px;top:150px}
.lock::after{width:300px;height:300px;right:-130px;bottom:-60px}
.lock .scroll{flex:1;overflow-y:auto;scrollbar-width:none;position:relative;z-index:1;padding-bottom:84px}
.lock .scroll::-webkit-scrollbar{display:none}
.lock .time{font:500 76px/1 var(--f-head);letter-spacing:-.04em;text-align:center;margin-top:20px;font-variant-numeric:tabular-nums}
.lock .date{text-align:center;font-size:14px;margin-top:6px;color:rgba(255,255,255,.88);font-weight:500}
.notif{margin:18px 16px 0;padding:10px 12px 11px;border-radius:20px;background:rgba(228,236,233,.94);color:var(--ink);cursor:pointer;text-align:left;display:block;width:calc(100% - 32px)}
.notif .t{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700}
.notif .t i{width:20px;height:20px;border-radius:6px;background:var(--g900);color:var(--amber);display:grid;place-items:center}
.notif .t i .ic{width:12px;height:12px}
.notif .t em{margin-left:auto;font-style:normal;font-weight:500;color:#7C8C86;font-size:10.5px}
.notif .b{display:flex;align-items:center;gap:9px;margin-top:8px}
.notif .b .ck{width:24px;height:24px;border-radius:50%;background:#DDEFE6;color:#2E9E6A;display:grid;place-items:center;flex:none}
.notif .b .ck .ic{width:14px;height:14px}
.notif b.h{display:block;font-size:13px}.notif span.s{display:block;font-size:11px;color:#6A7B75;margin-top:1px}
.pickcard{background:var(--cream);color:var(--ink);margin:20px 22px 0;border-radius:26px;padding:20px 18px 18px;text-align:center;box-shadow:0 24px 40px -20px rgba(0,0,0,.5)}
.pickcard .ok{width:44px;height:44px;border-radius:50%;background:var(--mint2);color:#2E9E6A;display:grid;place-items:center;margin:0 auto 10px}
.pickcard .num{font-size:10px;letter-spacing:.14em;font-weight:700;color:var(--orange-d)}
.pickcard h2{font:600 24px var(--f-head);letter-spacing:-.02em;color:var(--g900);margin:6px 0 3px}
.pickcard p{font-size:11.5px;color:#8C9A94}
.code{display:flex;gap:9px;justify-content:center;margin:16px 0}
.code .d{width:46px;height:54px;border-radius:14px;background:#fff;border:1px solid #E6E3DA;box-shadow:0 2px 0 rgba(0,0,0,.04);display:grid;place-items:center;font:600 25px var(--f-head);color:var(--g900)}
.where{display:flex;align-items:center;gap:10px;background:#EFEEE7;border-radius:14px;padding:10px 12px;text-align:left;margin-bottom:14px}
.where .bg{width:32px;height:32px;border-radius:50%;background:#fff;color:var(--orange-d);display:grid;place-items:center;flex:none}
.where small{display:block;font-size:10px;color:#8C9A94}.where b{display:block;font-size:14px}
.lock .fab{position:absolute;bottom:28px;width:46px;height:46px;border-radius:50%;background:rgba(10,40,38,.55);color:#fff;display:grid;place-items:center;z-index:5;backdrop-filter:blur(6px)}
.lock .fab.l{left:34px}.lock .fab.r{right:34px}
.lock .homebar{background:#fff}

/* --- Pedido retirado --- */
.done-hero{text-align:center;padding:18px 6px 4px}
.done-hero .big{width:72px;height:72px;border-radius:50%;background:var(--mint2);color:#2E9E6A;display:grid;place-items:center;margin:6px auto 14px}
.done-hero .big .ic{width:34px;height:34px}
.done-hero h2{font:600 27px var(--f-head);letter-spacing:-.02em;color:var(--g900)}
.done-hero p{font-size:13px;color:#6A7B75;margin-top:6px;line-height:1.45}
.kpi{display:flex;gap:10px;margin-top:16px}
.kpi div{flex:1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.kpi b{display:block;font:700 22px var(--f-head);color:var(--g900)}
.kpi small{font-size:10.5px;color:var(--mute)}
.stars{display:flex;justify-content:center;gap:6px;margin:8px 0 12px}
.stars button{color:#D4D1C6}.stars button.on{color:var(--amber)}
.stars .ic{width:30px;height:30px;fill:currentColor}

/* --- Pedidos / Perfil --- */
.ord{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px 15px;margin-bottom:10px}
.ord .top{display:flex;justify-content:space-between;align-items:center}
.ord b.id{font:600 16px var(--f-head);color:var(--g900)}
.ord .sum{font-size:12px;color:#6A7B75;margin:6px 0 8px}
.ord .bot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute)}
.st{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.03em}
.st.queued{background:#EFEDE8;color:#6B6B64}.st.cooking{background:var(--peach);color:var(--orange-d)}.st.ready{background:#D9F0E4;color:#1F7A4D}.st.picked{background:var(--mint);color:var(--g600)}
.me{display:flex;align-items:center;gap:14px;margin:8px 0 16px}
.me .av{width:58px;height:58px;border-radius:50%;background:var(--g900);color:var(--amber);display:grid;place-items:center;font:600 20px var(--f-head)}
.me b{display:block;font:600 19px var(--f-head);color:var(--g900)}.me small{font-size:12px;color:var(--mute)}
.wallet{background:linear-gradient(135deg,var(--g900),var(--g700));color:#fff;border-radius:20px;padding:16px 18px}
.wallet small{font-size:10px;letter-spacing:.14em;color:#9CC3B8;font-weight:700}
.wallet b{display:block;font:700 30px var(--f-head);margin:4px 0 12px}
.wallet .btn{height:38px;font-size:12.5px;border-radius:12px;padding:0 14px}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
.setrow small{color:var(--mute);font-size:11.5px}

/* --- Banner --- */
.backdrop{position:absolute;inset:0;z-index:50;background:rgba(8,40,38,.45);display:flex;align-items:flex-end}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:var(--cream);border-radius:28px 28px 0 0;padding:10px 20px 30px;scrollbar-width:none}
.sheet.anim{animation:up .26s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:42px;height:4px;border-radius:4px;background:#D9D6CB;margin:0 auto 14px}
.sheet h3{font:600 20px var(--f-head);letter-spacing:-.015em;color:var(--g900)}
.sheet .sub{font-size:12.5px;color:#7C8C86;margin:4px 0 12px;line-height:1.4}
.sheet .hero{height:150px;border-radius:18px;overflow:hidden;margin-bottom:14px}
.sheet .hero img{width:100%;height:100%;object-fit:cover}
.sheet .hero .art{height:100%}.sheet .hero .art svg{width:110px;height:120px}
.mods{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.mod{padding:7px 12px;border-radius:20px;border:1.5px solid #E1DED3;background:#fff;font-size:12px;font-weight:600}
.mod[aria-pressed="true"]{background:var(--sand2);border-color:var(--orange);color:#9A5A14}
.sheet .qty{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;font-weight:600;font-size:14px}
.qty .step{background:var(--mint2);color:var(--g900)}.qty .step button{color:var(--g900)}
.eline{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.eline .n{flex:1;font-size:13px;font-weight:600}.eline .n em{display:block;font-style:normal;font-size:11px;color:#B7791F;font-weight:500}
.eline .pr{font-size:12.5px;font-weight:700;min-width:54px;text-align:right}
.eline .step{background:var(--mint2);color:var(--g900)}.eline .step button{color:var(--g900)}
.eline .del{color:#B04A3A;width:30px;height:30px;display:grid;place-items:center}
.eta-li{display:flex;gap:10px;margin:10px 0;font-size:12.5px;line-height:1.4;color:#33504B}
.eta-li .ic{color:var(--g600);flex:none;margin-top:1px}
.toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);z-index:70;max-width:86%;background:#10302E;color:#fff;font-size:12.5px;font-weight:500;padding:10px 15px;border-radius:14px;text-align:center;box-shadow:0 10px 24px -8px rgba(0,0,0,.5);animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translate(-50%,8px)}}
.banner{position:absolute;top:44px;left:10px;right:10px;z-index:80;background:rgba(255,255,255,.97);border-radius:20px;padding:10px 13px;box-shadow:0 14px 30px -10px rgba(0,0,0,.45);text-align:left;display:block;width:calc(100% - 20px)}
.banner.fresh{animation:drop .4s cubic-bezier(.2,.9,.3,1.2)}
@keyframes drop{from{transform:translateY(-130%)}}
.banner .t{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;color:var(--ink)}
.banner .t i{width:20px;height:20px;border-radius:6px;background:var(--g900);color:var(--amber);display:grid;place-items:center}
.banner .t i .ic{width:12px;height:12px}.banner .t em{margin-left:auto;font-style:normal;font-weight:500;color:#7C8C86}
.banner b{display:block;font-size:13.5px;margin-top:6px;color:var(--ink)}.banner span{display:block;font-size:11.5px;color:#6A7B75;margin-top:1px}

/* ============ TABLERO DE COCINA ============ */
.tablet{position:relative;width:1080px;height:700px;border:8px solid var(--g900);border-radius:30px;background:var(--page);overflow:hidden;box-shadow:0 34px 60px -26px rgba(10,61,59,.45),0 0 0 1px rgba(10,61,59,.08);display:flex;flex-direction:column}
.kh{flex:none;height:62px;background:var(--g900);display:flex;align-items:center;padding:0 22px;gap:14px;color:#fff;position:relative}
.kh .logo{width:38px;height:38px;border-radius:11px;background:var(--amber);color:var(--g900);display:grid;place-items:center}
.kh .t b{display:block;font:600 15px var(--f-head);letter-spacing:-.01em}.kh .t small{display:block;font-size:10.5px;color:#9FC2B8;margin-top:1px}
.kh .mid{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;font-size:12px;font-weight:600;background:rgba(255,255,255,.07);padding:7px 14px;border-radius:20px;white-space:nowrap}
.kh .mid i{width:8px;height:8px;border-radius:50%;background:#4ADE80;box-shadow:0 0 0 3px rgba(74,222,128,.2)}
.kh .mid span{padding-left:12px;border-left:1px solid rgba(255,255,255,.2);color:#CFE3DB;font-variant-numeric:tabular-nums}
.kh .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.kh .bell{width:38px;height:38px;border-radius:11px;border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;position:relative;color:#fff}
.kh .bell .dot{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--orange);border:2px solid var(--g900)}
.kh .av{width:36px;height:36px;border-radius:50%;background:#D4E6DF;color:var(--g900);display:grid;place-items:center;font-weight:700;font-size:12px}
.kb{flex:1;overflow-y:auto;padding:20px 24px 24px;scrollbar-width:thin}
.kb .top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px}
.kb .eyebrow{color:#8A9A93}
.kb h2{font:600 26px var(--f-head);letter-spacing:-.02em;color:var(--g900);margin-top:6px;display:flex;align-items:center;gap:12px}
.kb h2 .cnt{font:600 11px var(--f-body);background:var(--mint2);color:#2E6B5A;padding:4px 10px;border-radius:10px;letter-spacing:0}
.kseg{display:inline-flex;background:#E8EAE4;padding:4px;border-radius:12px;gap:2px}
.kseg button{padding:6px 14px;border-radius:9px;font-size:12px;font-weight:600;color:#7C8C86}
.kseg button[aria-pressed="true"]{background:#fff;color:var(--g900);box-shadow:0 1px 3px rgba(10,61,59,.15)}
.lanes{display:grid;gap:18px;align-items:start}
.lanes.all{grid-template-columns:minmax(0,.86fr) minmax(0,1.35fr)}
.lanes.one{grid-template-columns:1fr}
.lane{background:var(--lane);border-radius:24px;padding:14px;min-height:300px}
.lane .lh{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.lane .lh .ti{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
.lane .lh .ti.q{background:#FBE6B0;color:#8A5F00}.lane .lh .ti.f{background:#D5E7DF;color:#2E6B5A}
.lane .lh b{font:600 14.5px var(--f-head);color:var(--g900)}
.lane .lh .c{background:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:9px;color:var(--g800)}
.lane .lh small{margin-left:auto;font-size:10.5px;color:#8A9A93}
.cards{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.lanes.one .cards{grid-template-columns:repeat(4,minmax(0,1fr))}
.kc{background:#fff;border-radius:15px;padding:12px 13px 10px;border-top:3.5px solid #C9D3CD;box-shadow:0 2px 6px -3px rgba(10,61,59,.18);display:flex;flex-direction:column;min-height:132px}
.kc.act{border-top-color:var(--orange)}
.kc.late{box-shadow:0 0 0 1.5px rgba(217,72,15,.35),0 2px 6px -3px rgba(10,61,59,.18)}
.kc .h{display:flex;justify-content:space-between;align-items:center;padding-bottom:9px;border-bottom:1.5px dashed #E4E1D7}
.kc .h b{font:700 16px var(--f-head);letter-spacing:-.01em;color:var(--g900)}
.kc .h .tm{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:#8A9A93;font-variant-numeric:tabular-nums}
.kc .h .tm .ic{width:13px;height:13px}
.kc.act .h .tm{color:var(--orange-d)}
.kc .it{font-size:12px;margin-top:8px;color:#22504B;font-weight:500}.kc .it i{font-style:normal;color:#9AA6A1;margin-right:5px;font-size:11px}
.kc .nt{display:inline-block;background:var(--sand2);color:#B7791F;font-size:10px;font-weight:600;padding:3px 8px;border-radius:7px;margin-top:8px;margin-right:4px}
.kc .late-tag{display:inline-block;background:#FDE3DA;color:#B93815;font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:6px;margin-top:8px}
.kc .mine{display:inline-block;background:var(--g900);color:var(--amber);font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:6px;margin-top:8px;margin-right:4px;letter-spacing:.04em}
.kc .f{margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;align-items:center}
.kc .s,.kc .go{white-space:nowrap}
.kc .s{display:flex;align-items:center;gap:6px;font-size:9.5px;font-weight:700;letter-spacing:.07em;color:#8A9A93}
.kc .s i{width:7px;height:7px;border-radius:50%;background:#B8B8B0}
.kc .s.cooking i{background:var(--orange)}.kc .s.ready i{background:#2E9E6A}
.kc .go{font-size:11px;font-weight:700;color:var(--g700);display:flex;align-items:center;gap:2px;padding:3px 6px;border-radius:8px}
.kc .go:hover{background:var(--mint)}.kc .go .ic{width:13px;height:13px}
.kempty{grid-column:1/-1;text-align:center;color:#8A9A93;font-size:12.5px;padding:46px 10px}
.ktoast{position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:30;background:var(--g900);color:#fff;border-radius:14px;padding:10px 16px;font-size:12.5px;font-weight:600;box-shadow:0 12px 26px -10px rgba(0,0,0,.5);animation:kdrop .35s}
.ktoast i{font-style:normal;color:var(--amber)}
@keyframes kdrop{from{opacity:0;transform:translate(-50%,-14px)}}

/* ============ (pruebas con usuarios) ============ */
.modal{position:fixed;inset:0;z-index:300;background:rgba(8,40,38,.55);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.mcard{background:var(--cream);border-radius:24px;width:min(640px,100%);max-height:94vh;overflow:auto;padding:24px 26px 22px;box-shadow:0 30px 70px -20px rgba(0,0,0,.6)}
.mcard h2{font:600 24px var(--f-head);letter-spacing:-.02em;color:var(--g900)}
.mcard .lead{font-size:13px;color:#5E6F69;margin:6px 0 14px;line-height:1.5}
.mcard label.f{display:block;font-size:12px;font-weight:700;color:var(--g800);margin:12px 0 5px}
.mcard input[type=text],.mcard textarea{width:100%;border:1.5px solid #DAD7CC;border-radius:12px;padding:10px 12px;background:#fff;font-size:13.5px}
.mcard textarea{min-height:64px;resize:vertical}
.scn{background:var(--sand);border:1px solid #F4E0B5;border-radius:14px;padding:13px 15px;font-size:13.5px;line-height:1.5;color:#6E4A12;margin-top:10px}
.scn b{display:block;margin-bottom:4px;color:#8A5A14;font-size:11px;letter-spacing:.1em}
.mrow{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.mrow .btn{height:42px;font-size:13.5px;border-radius:12px}
.sus{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
.sus th{font-size:10.5px;color:var(--mute);font-weight:600;text-align:center;padding:4px 2px}
.sus td{padding:8px 4px;border-top:1px solid var(--line);vertical-align:middle}
.sus td.q{width:58%;line-height:1.35}
.sus td.r{text-align:center}
.sus input{accent-color:var(--g900);width:17px;height:17px}
.sus tr.miss td.q{color:var(--err);font-weight:600}
.res{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
.res th,.res td{border:1px solid #E1DED3;padding:6px 8px;text-align:left;vertical-align:top}
.res th{background:var(--mint);color:var(--g800)}
.kpis{display:flex;gap:10px;margin:12px 0}
.kpis div{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;text-align:center}
.kpis b{display:block;font:700 22px var(--f-head);color:var(--g900)}.kpis small{font-size:11px;color:var(--mute)}

/* ============ RESPONSIVE ============ */
@media (max-width:560px){
  .chrome{padding:8px 12px;gap:8px}
  .brand small{display:none}
  .ctl{width:100%;gap:8px}
  .stage{padding:0;display:block}
  .screen-label{display:none}
  .col[data-col="student"] .phone{width:100vw;height:calc(100dvh - var(--chrome-h));border:0;border-radius:0}
  .homebar{display:none}
  body[data-view="kitchen"] .col[data-col="kitchen"]{padding:10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ==========================================================================
   Logo, restaurantes, registro, opciones, kit. de cocina
   ========================================================================== */
/* --- LOGO:--- */
.logo{display:grid;place-items:center;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.brand .logo{width:36px;height:36px;border-radius:11px;background:var(--g900);color:var(--amber);font:700 17px var(--f-head)}
.brand .logo:has(img),.minibrand .logo:has(img),.kh .logo:has(img){background:transparent}
.minibrand{display:flex;align-items:center;gap:8px;font:600 14px var(--f-head);color:var(--g800);letter-spacing:-.01em}
.minibrand .logo{width:26px;height:26px;border-radius:8px;background:var(--g900);color:var(--amber);font:700 13px var(--f-head)}
.kh .logo{width:40px;height:40px;border-radius:11px;background:var(--amber);color:var(--g900);font:700 18px var(--f-head)}
.kh .t b{font-size:16px}

/* --- Registro / formularios --- */
.reg-hero{text-align:center;padding:10px 0 4px}
.reg-hero .logo{width:62px;height:62px;border-radius:18px;background:var(--g900);color:var(--amber);font:700 30px var(--f-head);margin:0 auto 12px}
.reg-hero .logo:has(img){background:transparent}
.reg-hero p{font-size:13px;color:#6A7B75;margin-top:6px;line-height:1.45}
.fl{display:block;font-size:12px;font-weight:700;color:var(--g800);margin:13px 0 5px}
.inp{width:100%;border:1.5px solid #DAD7CC;border-radius:13px;padding:12px 13px;background:#fff;font-size:14px;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--g900)}
.inp.bad{border-color:#E4837A;background:#FFF8F7}
.ferr{font-size:11.5px;color:var(--err);margin-top:5px;line-height:1.35}
.inline{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:8px}
.fine{font-size:10.5px;color:var(--mute);text-align:center;margin-top:12px;line-height:1.4}

/* --- Selección de restaurante --- */
.rc{display:grid;grid-template-columns:54px 1fr 20px;gap:13px;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid #ECE9E1;border-radius:20px;padding:13px 14px;margin-bottom:11px;transition:box-shadow .15s,transform .15s}
.rc:hover{box-shadow:0 8px 20px -10px rgba(10,61,59,.3);transform:translateY(-1px)}
.rc .tile{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;color:#fff;font:700 18px var(--f-head);letter-spacing:.02em}
.rc b{display:block;font:600 17px var(--f-head);color:var(--g900);letter-spacing:-.01em}
.rc .loc{display:flex;align-items:center;gap:4px;font-size:11.5px;color:#5E6F69;margin-top:3px;font-weight:500}
.rc .loc .ic{width:13px;height:13px;color:var(--orange-d)}
.rc .bl{font-size:11.5px;color:#8C9A94;margin-top:3px;line-height:1.3}
.rc .meta{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.rc .chev{color:#B3BDB8}
.where-line{display:flex;align-items:center;gap:6px;font-size:12px;color:#4D6A62;margin:-6px 0 12px;font-weight:500}
.where-line .ic{width:14px;height:14px;color:var(--orange-d)}
.where-line .link{margin-left:auto}

/* --- Opciones de un plato (hoja inferior) --- */
.og{margin:12px 0 4px}
.og-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.og-h b{font-size:13.5px;color:var(--g900)}
.og-t{font-size:10.5px;color:var(--mute);font-weight:600}
.og-t.req{color:var(--orange-d)}
.mod small{font-weight:700;color:#9A5A14;margin-left:3px}
.need{font-size:11.5px;color:var(--orange-d);font-weight:600;text-align:center;margin:-6px 0 10px}
.btn.dark:disabled{opacity:.5;cursor:not-allowed}

/* --- Pago --- */
.payform{background:#fff;border:1px solid var(--line);border-radius:16px;padding:2px 14px 14px;margin:-2px 0 10px}
.payform .fl:first-child{margin-top:10px}
.hint{font-size:11px;color:var(--mute);margin-top:5px}
.cashnote{display:flex;gap:10px;background:var(--mint);border-radius:14px;padding:11px 13px;font-size:12px;color:#2E6B5A;line-height:1.4;margin:-2px 0 10px}
.cashnote .ic{flex:none;margin-top:1px;width:18px;height:18px}
.note-line{display:block;font-style:normal;font-size:10.5px;color:#B7791F;margin-top:1px;line-height:1.3}

/* --- Tablero de cocina -- */
.kroot{display:flex;flex-direction:column;flex:1;min-height:0}

.paytag.cash{background:#FFF0C9;color:#8A5F00}

.kmodal{position:absolute;inset:0;z-index:50;background:rgba(8,40,38,.55);display:grid;place-items:center;padding:20px}

.kbox h3{font:600 21px var(--f-head);color:var(--g900);letter-spacing:-.015em}

<body data-view="both" data-test="off">

<!-- ========== BARRA SUPERIOR DE LA DEMO ========== -->
<header class="chrome" id="chrome">
  <!-- LOGO + nombre -->
  <div class="brand" id="brand"></div>
  <div class="seg" role="group" aria-label="Vista del prototipo">
    <button type="button" data-view="student" aria-pressed="false">Estudiante</button>
    <button type="button" data-view="kitchen" aria-pressed="false">Cocina</button>
    <button type="button" data-view="both" aria-pressed="true">Ambos</button>
  </div>
  <div class="ctl">
    <span class="simhint" id="simhint" title="El reloj de la demostración corre más rápido que el real"></span>
    <label>Velocidad
      <select id="speed" aria-label="Velocidad de la simulación">
        <option value="10">×10</option><option value="20" selected>×20</option><option value="40">×40</option>
      </select>

    <label><input type="checkbox" id="auto" checked> Cocina automática</label>

  <div class="testbar"><b id="testwho">Modo prueba</b><button type="button" class="ghost" id="btn-endtest" style="padding:6px 10px;border-radius:9px;border:1px solid #D9D6CB;background:#fff;font-weight:600">Terminar</button></div>
</header>

<main class="stage" id="stage">

  <section class="col" data-col="kitchen" aria-label="Tablero de cocina">

  </section>
</main>

// --- selección de opciones de un plato ---
const notesFrom = (it, sel, mods = []) => [...it.opts.filter(g => sel[g.id] && sel[g.id].length).map(g => `${g.label.replace(/ \(.*\)/, '')}: ${sel[g.id].join(', ')}`), ...mods];
const extrasOf = (it, sel) => it.opts.reduce((a, g) => a + (sel[g.id] || []).reduce((b, n) => b + ((g.ch.find(c => c.n === n) || {}).p || 0), 0), 0);
const missingOpts = (it, sel) => it.opts.filter(g => g.min > 0 && (sel[g.id] || []).length < g.min);
function randomSel(it) {                               
  const sel = {};
  it.opts.forEach(g => {
    const n = g.min > 0 ? 1 : (Math.random() < .3 ? 1 + Math.floor(Math.random() * Math.min(2, g.max)) : 0);
    const chosen = [...g.ch].sort(() => Math.random() - .5).slice(0, n);
    if (chosen.length) sel[g.id] = chosen.map(c => c.n);
  });
  return sel;
}

const sim = {
  speed: 20, base: START_SIM, t0: performance.now(),
  now() { return this.base + (performance.now() - this.t0) / 1000 * this.speed; },
  setSpeed(v) { this.base = this.now(); this.t0 = performance.now(); this.speed = v; },
  reset() { this.base = START_SIM; this.t0 = performance.now(); },
};

const LS = 'bosqueexpress.v2', LS_RUNS = 'bosqueexpress.pruebas.v1';
const lsGet = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento: sigue en memoria */ } };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };

/* =============================================================================
   MOTOR DE COCINA  (un tablero por restaurante)
   ============================================================================= */
const LANES = {
  quick: { name: 'Bebidas y snacks',    meta: 'Meta: menos de 5 min',              target: 300, slots: 2, icon: 'sparkle', cls: 'q' },
  full:  { name: 'Almuerzos completos', meta: 'Ordenados por tiempo transcurrido', target: 900, slots: 2, icon: 'chef',    cls: 'f' },
};
const laneOf = lines => lines.some(l => item(l.id).cat === 'almuerzo') ? 'full' : 'quick';
function prepFor(lines) {                         
  if (!lines.length) return 0;
  if (laneOf(lines) === 'full') {
    const big = lines.filter(l => item(l.id).cat === 'almuerzo');
    const main = Math.max(...big.map(l => item(l.id).prep * (1 + .25 * (l.qty - 1))));
    return Math.round(main + 30 * (lines.length - 1));
  }
  const sum = lines.reduce((a, l) => a + item(l.id).prep * l.qty, 0);
  return Math.round(Math.min(240, Math.max(60, sum)));
}
const lineTotal = l => (l.unit != null ? l.unit : item(l.id).price) * l.qty;
const subOf = lines => lines.reduce((a, l) => a + lineTotal(l), 0);
const kItems = lines => lines.map(l => ({ id: l.id, name: item(l.id).name, qty: l.qty, notes: [...l.notes] }));
// Código de entrega de 4 dígitos, único entre los pedidos activos
const genCode = () => { let c; do { c = String(1000 + Math.floor(Math.random() * 9000)); } while (kitchen.orders.some(o => o.code === c)); return c; };

// Pedido aleatorio de un restaurante (pedidos "de otros estudiantes")
function randomLines(rid, lane) {
  const pool = c => MENU.filter(m => m.rest === rid && m.cat === c && m.stock !== 'out');
  const mk = it => { const sel = randomSel(it); return { id: it.id, qty: 1, unit: it.price + extrasOf(it, sel), notes: notesFrom(it, sel, Math.random() < .2 && it.mods.length ? [pick(it.mods)] : []) }; };
  const lines = [];
  if (lane === 'full') { lines.push(mk(pick(pool('almuerzo')))); if (pool('bebida').length && Math.random() < .45) lines.push(mk(pick(pool('bebida')))); }
  else { const q = [...pool('snack'), ...pool('bebida')]; lines.push(mk(pick(q))); if (Math.random() < .4) lines.push(mk(pick(q))); }
  return lines;
}

const kitchen = {
  orders: [], auto: true, viewRest: 'labarra', filter: 'all', newDot: false, listeners: [], nextAmb: {}, born: performance.now(), verify: null,
  emit() { this.listeners.forEach(f => f()); },
  mk(p) { return Object.assign({ status: 'queued', startSim: null, readySim: null, mine: false, pay: 'cash', total: 0, code: genCode() }, p); },
  byLane(rest, lane) { return this.orders.filter(o => o.rest === rest && o.lane === lane); },

  // Pedidos iniciales de cada restaurante (para que el tablero no arranque vacío)
  seed() {
    const n = sim.now(); this.born = performance.now(); this.nextAmb = {}; this.orders = []; this.verify = null; let num = 150;
    REST.forEach(r => {
      const mkO = (lane, status, age, started) => {
        const lines = randomLines(r.id, lane);
        this.orders.push(this.mk({ id: 'A-' + (num++), rest: r.id, lane, items: kItems(lines), status, createdSim: n - age, startSim: started != null ? n - started : null,
          readySim: status === 'ready' ? n - 60 : null, prepSec: prepFor(lines), pay: pick(['cash', 'nequi', 'card']), total: subOf(lines) + SERVICE_FEE }));
      };
      mkO('full', 'cooking', 640, 560); mkO('full', 'cooking', 420, 330); mkO('full', 'queued', 190, null);
      if (lanesOf(r.id).includes('quick')) { mkO('quick', 'cooking', 250, 200); mkO('quick', 'queued', 100, null); mkO('quick', 'ready', 380, 300); }
      else mkO('full', 'ready', 500, 420);
    });
  },

  // Cuándo estaría listo un pedido nuevo 
  estimate(rest, lane, prep) {
    const now = sim.now(), os = this.byLane(rest, lane);
    const free = os.filter(o => o.status === 'cooking').map(o => Math.max(now, o.startSim + o.prepSec));
    while (free.length < LANES[lane].slots) free.push(now);
    free.sort((a, b) => a - b);
    os.filter(o => o.status === 'queued').sort((a, b) => a.createdSim - b.createdSim).forEach(q => { const t = free.shift(); free.push(t + q.prepSec); free.sort((a, b) => a - b); });
    return { startSim: free[0], readySim: free[0] + prep, ahead: os.filter(o => o.status === 'queued' || o.status === 'cooking').length };
  },

  add(o) { this.orders.push(o); this.viewRest = o.rest; this.newDot = true; this.emit(); },
  advance(id) {                                    
    const o = this.orders.find(x => x.id === id); if (!o) return; const now = sim.now();
    if (o.status === 'queued') { o.status = 'cooking'; o.startSim = now; }
    else if (o.status === 'cooking') { o.status = 'ready'; o.readySim = now; if (o.mine && this.onMineReady) this.onMineReady(o); }
    this.emit();
  },
  deliver(id) {                                   
    const o = this.orders.find(x => x.id === id); if (!o) return;
    this.orders = this.orders.filter(x => x !== o);
    if (o.mine && this.onMineDelivered) this.onMineDelivered(o);
    this.emit();
  },
  // Llegan pedidos nuevos de otros estudiantes cada tanto (solo si esta en "Cocina automática")
  ambient(now) {
    if (performance.now() - this.born < 45000) return false;
    let changed = false;
    REST.forEach(r => {
      if (now < (this.nextAmb[r.id] || 0)) return;
      this.nextAmb[r.id] = now + 70 + Math.random() * 100;
      const lanes = lanesOf(r.id), lane = lanes.length === 1 ? 'full' : (Math.random() < .4 ? 'full' : 'quick');
      if (this.byLane(r.id, lane).filter(o => o.status === 'queued' || o.status === 'cooking').length >= 5) return;
      const lines = randomLines(r.id, lane);
      this.orders.push(this.mk({ id: 'A-' + nextNumber(), rest: r.id, lane, items: kItems(lines), createdSim: now, prepSec: prepFor(lines), pay: pick(['cash', 'nequi', 'card']), total: subOf(lines) + SERVICE_FEE }));
      changed = true;
    });
    return changed;
  },
  tick() {
    const now = sim.now(); let ch = false;
    if (this.auto) {
      for (const o of this.orders) if (o.status === 'cooking' && now >= o.startSim + o.prepSec) {
        o.status = 'ready'; o.readySim = o.startSim + o.prepSec; ch = true; if (o.mine && this.onMineReady) this.onMineReady(o);
      }
      REST.forEach(r => ['quick', 'full'].forEach(lane => {
        let running = this.byLane(r.id, lane).filter(o => o.status === 'cooking').length;
        const q = this.byLane(r.id, lane).filter(o => o.status === 'queued').sort((a, b) => a.createdSim - b.createdSim);
        while (running < LANES[lane].slots && q.length) { const o = q.shift(); o.status = 'cooking'; o.startSim = now; running++; ch = true; }
      }));
      const n0 = this.orders.length;     // pedidos ajenos listos hace más de 5 min "ya fueron recogidos"
      this.orders = this.orders.filter(o => !(o.status === 'ready' && !o.mine && now - o.readySim > 300));
      if (this.orders.length !== n0) ch = true;
      if (this.ambient(now)) ch = true;
    }
    if (ch) this.emit();
  },
};

const PAY = {
  cash:  { label: 'Efectivo',       sub: 'Pagas al recibir tu pedido',  icon: 'cash' },
  nequi: { label: 'Nequi',          sub: 'Pago desde tu celular',       icon: 'phone' },
  card:  { label: 'Tarjeta débito', sub: 'Visa o Mastercard débito',    icon: 'card' },
};
function etaFor(rest, lane, prep) {
  const e = kitchen.estimate(rest, lane, prep), a = Math.ceil(e.readySim / 300) * 300;  
  return { a, b: a + 600, readySim: e.readySim, ahead: e.ahead, lane };
}
const api = {
  listarMenu: rid => wait(650, MENU.filter(m => m.rest === rid)),

  async crearPedido({ rest, lines, metodo, datos, num }) {
    await wait(metodo === 'cash' ? 700 : 1600);             
    for (const l of lines) if (item(l.id).stock === 'out') throw new Error(`${item(l.id).name} se agotó mientras pagabas.`);
    // --- validación del medio de pago (en el backend real la hace la pasarela) ---
    if (metodo === 'nequi' && !/^3\d{9}$/.test((datos.nequi || '').replace(/\s/g, ''))) throw new Error('El número de Nequi debe tener 10 dígitos y empezar por 3.');
    if (metodo === 'card') {
      const n = (datos.card || '').replace(/\s/g, '');
      if (!/^\d{16}$/.test(n)) throw new Error('El número de la tarjeta debe tener 16 dígitos.');
      if (!/^(0[1-9]|1[0-2])\/\d{2}$/.test((datos.exp || '').trim())) throw new Error('La fecha de vencimiento debe ser MM/AA.');
      if (!/^\d{3}$/.test((datos.cvv || '').trim())) throw new Error('El CVV son 3 dígitos.');
      if (n === '4000000000000002') throw new Error('Tu banco rechazó la transacción (tarjeta de prueba rechazada).');
    }
    const sub = subOf(lines), total = sub + SERVICE_FEE, lane = laneOf(lines), prep = prepFor(lines), e = etaFor(rest, lane, prep);
    const order = {
      id: 'A-' + num, num, rest, lines: lines.map(l => ({ ...l, notes: [...l.notes] })), sub, fee: SERVICE_FEE, total, method: metodo, lane, prep,
     code: genCode(),                   
      status: 'queued', createdSim: sim.now(), eta: { a: e.a, b: e.b }, readySim: null, pickedSim: null, rating: 0,
    };
    S.orders.unshift(order); persist();
    // el pedido aparece en el tablero del restaurante correspondiente
    kitchen.add(kitchen.mk({ id: order.id, rest, lane, items: kItems(lines), status: 'queued', createdSim: order.createdSim, prepSec: prep, mine: true, pay: metodo, total, code: order.code }));
    return order;
  },
  async marcarRetirado() { await wait(350); return true; },
};

function onAppClick(e) {
  const t = e.target.closest('[data-act]'); if (!t) return;
  if (t.dataset.backdrop && e.target !== t) return;               
  const a = t.dataset.act, id = t.dataset.id;
  switch (a) {
    case 'register': doRegister(); return;
    case 'logout': resetDemo(true); return;
    case 'nav': { const to = t.dataset.to; ui.screen = to === 'menu' ? (ui.rest ? 'home' : 'restaurants') : to; break; }
    case 'pickRest':
      if (ui.rest === id) { ui.screen = 'home'; break; }
      if (ui.cart.length && ui.rest) { ui.sheet = { type: 'switch', to: id }; ui.sheetAnim = true; break; }
      selectRest(id); break;
    case 'switchOk': { const to = ui.sheet.to; ui.sheet = null; selectRest(to); break; }
    case 'changeRest': ui.screen = 'restaurants'; break;
    case 'goRestaurants': ui.screen = 'restaurants'; break;
    case 'cat': ui.cat = t.dataset.cat; break;
    case 'toggleSearch': ui.searching = !ui.searching; if (!ui.searching) ui.query = ''; renderApp(); if (ui.searching) { const q = $('#q'); if (q) q.focus(); } return;
    case 'etaInfo': ui.sheet = { type: 'eta' }; ui.sheetAnim = true; break;
    case 'add': addItem(id); break;
    case 'dec': decItem(id); break;
    case 'openItem': ui.sheet = { type: 'item', id, qty: 1, sel: {}, mods: [] }; ui.sheetAnim = true; break;
    case 'sheetMod': { const m = t.dataset.m, n = ui.sheet.mods, i = n.indexOf(m); i < 0 ? n.push(m) : n.splice(i, 1); break; }
    case 'sheetOpt': {                                              
      const s = ui.sheet, g = item(s.id).opts.find(x => x.id === t.dataset.g), c = t.dataset.c, cur = s.sel[g.id] || [], has = cur.includes(c);
      if (g.max === 1) s.sel[g.id] = has && g.min === 0 ? [] : [c];
      else if (has) s.sel[g.id] = cur.filter(x => x !== c);
      else if (cur.length >= g.max) { toast(`Puedes elegir hasta ${g.max}`); break; }
      else s.sel[g.id] = [...cur, c];
      break;
    }
    case 'sheetInc': ui.sheet.qty = Math.min(maxFor(item(ui.sheet.id)), ui.sheet.qty + 1); break;
    case 'sheetDec': ui.sheet.qty = Math.max(1, ui.sheet.qty - 1); break;
    case 'sheetAdd': { const s = ui.sheet, it = item(s.id); if (missingOpts(it, s.sel).length) break;
      if (addItem(s.id, notesFrom(it, s.sel, s.mods), s.qty, it.price + extrasOf(it, s.sel))) { toast(`${it.name} agregado`); ui.sheet = null; } break; }
    case 'closeSheet': ui.sheet = null; break;
    case 'openCart': if (!ui.cart.length) { toast('Tu pedido está vacío'); return; } ui.screen = 'confirm'; ui.error = null; break;
    case 'edit': ui.sheet = { type: 'edit' }; ui.sheetAnim = true; break;
    case 'lineInc': { const l = ui.cart[+t.dataset.i]; if (l) { const it = item(l.id); if (qtyOf(l.id) >= maxFor(it)) toast(it.stock === 'low' ? `Solo quedan ${it.left} de ${it.name}` : 'Máximo 9 unidades por plato'); else l.qty++; } break; }
    case 'lineDec': { const l = ui.cart[+t.dataset.i]; if (l) { l.qty--; if (l.qty <= 0) ui.cart.splice(+t.dataset.i, 1); } break; }
    case 'lineDel': ui.cart.splice(+t.dataset.i, 1); break;
    case 'backHome': ui.screen = 'home'; ui.error = null; break;
    case 'goMenu': ui.screen = ui.rest ? 'home' : 'restaurants'; break;
    case 'method': ui.method = t.dataset.m; ui.error = null; if (ui.method === 'nequi' && ui.form['f-nequi'] === undefined && S.profile) ui.form['f-nequi'] = S.profile.phone; break;
    case 'pay': doPay(); return;
    case 'goTracking': ui.activeId = id; { const o = orderById(id); ui.screen = o && o.status === 'picked' ? 'done' : 'tracking'; } ui.banner = null; break;
    case 'openPickup': ui.activeId = id; ui.screen = 'pickup'; ui.banner = null; break;
    case 'pickedUp': doPickup(id); return;
    case 'rate': ui.rating = +t.dataset.n; break;
    case 'sendRating': { const o = orderById(ui.activeId); if (o) { o.rating = ui.rating; persist(); } ui.ratingSent = true; toast('¡Gracias por tu opinión!'); break; }
    default: return;
  }
  if (ui.screen === 'confirm' && !ui.cart.length) { ui.screen = 'home'; ui.sheet = null; toast('Tu pedido quedó vacío'); }
  renderApp();

const PAY_TAG = { cash: 'Efectivo', nequi: 'Nequi · pagado', card: 'Débito · pagado' };

// TARJETA DE UN PEDIDO EN COCINA (qué se muestra en cada tarjeta)
function cardHTML(o) {
  const lane = LANES[o.lane], el = sim.now() - o.createdSim, act = o.status !== 'queued';
  const late = o.status !== 'ready' && el > lane.target;
  const lab = { queued: 'EN COLA', cooking: 'PREPARANDO', ready: 'LISTO' }[o.status], go = { queued: 'Iniciar', cooking: 'Marcar listo', ready: 'Entregar' }[o.status];
  const items = o.items.map(i => `<div class="it"><b><i>${i.qty}×</i>${esc(i.name)}</b>${i.notes.map(n => `<span class="nt">${esc(n)}</span>`).join('')}</div>`).join('');
  const payTxt = o.pay === 'cash' ? `Efectivo · cobrar ${money(o.total)}` : PAY_TAG[o.pay];
  return `<article class="kc ${act ? 'act' : ''} ${late ? 'late' : ''}" aria-label="Pedido ${o.id}">
    <div class="h"><b>#${o.id}</b><span class="tm">${I('clock')}<span data-t="${o.createdSim}" ${o.status === 'ready' ? `data-frozen="1"` : ''}>${mmss(o.status === 'ready' ? o.readySim - o.createdSim : el)}</span></span></div>
    ${items}
    <div>${o.mine ? '<span class="mine">TU PEDIDO</span>' : ''}<span class="paytag ${o.pay === 'cash' ? 'cash' : ''}">${payTxt}</span>${late ? '<span class="late-tag">Fuera de meta</span>' : ''}</div>
    ${o.status === 'ready' ? `<div class="codebox">Código de entrega: <b>${o.code}</b></div>` : ''}
    <div class="f"><span class="s ${o.status}"><i></i>${lab}</span><button class="go" data-kact="${o.status === 'ready' ? 'deliver' : 'advance'}" data-id="${o.id}" aria-label="${go} pedido ${o.id}">${go}${I('right')}</button></div></article>`;
}
function laneHTML(rid, l) {
  const L = LANES[l], rank = { cooking: 0, queued: 1, ready: 2 };
  const os = kitchen.byLane(rid, l).sort((a, b) => rank[a.status] - rank[b.status] || a.createdSim - b.createdSim);
  const n = os.filter(o => o.status !== 'ready').length;
  return `<section class="lane" aria-label="${L.name}"><div class="lh"><span class="ti ${L.cls}">${I(L.icon)}</span><b>${L.name}</b><span class="c">${n}</span><small>${L.meta}</small></div>
    <div class="cards">${os.length ? os.map(cardHTML).join('') : '<div class="kempty">Sin pedidos en esta línea</div>'}</div></section>`;
}
function renderKitchen() {
  const el = $('#kroot'), body = $('.kb', el), top = body ? body.scrollTop : 0;
  const r = restById(kitchen.viewRest), lanes = lanesOf(r.id), one = lanes.length === 1;
  const active = kitchen.orders.filter(o => o.rest === r.id && o.status !== 'ready').length;
  const f = one ? 'full' : kitchen.filter, show = f === 'all' ? lanes : [f];

// VERIFICACIÓN DEL CÓDIGO DE ENTREGA: cocina escribe el código que muestra el cliente
function renderKModal() {
  const host = $('#kmodal'), v = kitchen.verify;

  const o = kitchen.orders.find(x => x.id === v.id); if (!o) { kitchen.verify = null; host.innerHTML = ''; return; }

function verifyCode() {

  const prof = S.profile; lsDel(LS); S = freshState(); if (!wipeProfile) S.profile = prof; persist(); knownIds = new Set();
  Object.assign(ui, { screen: S.profile ? 'restaurants' : 'register', rest: null, cat: 'almuerzo', query: '', searching: false, loading: false, cart: [], sheet: null, method: 'cash', error: null, paying: false, reserved: null, activeId: null, banner: null, rating: 0, ratingSent: false, form: {}, errs: {} });
  sim.reset(); kitchen.seed(); kitchen.newDot = false; kitchen.viewRest = REST[0].id; kitchen.orders.forEach(k => knownIds.add(k.id));
  renderApp(); renderKitchen(); renderKModal();
}
function boot() {
  $('#brand').innerHTML = `${logoHTML()}<div><b>${APP_NAME}</b><small>Prototipo navegable Seminario de Investigación</small></div>`;
  sim.speed = +$('#speed').value;
  const hint = () => $('#simhint').textContent = `Reloj simulado: 1 min = ${(60 / sim.speed).toFixed(0)} s`; hint();
  kitchen.seed(); kitchen.orders.forEach(k => knownIds.add(k.id));
  ui.screen = S.profile ? 'restaurants' : 'register';          
  renderApp(); renderKitchen();
  setInterval(() => kitchen.tick(), 250);
  setInterval(() => {                                           
    const now = sim.now(), hm = clockHM(now);
    $$('[data-simclock]').forEach(e => { if (e.textContent !== hm) e.textContent = hm; });
    $$('[data-t]').forEach(e => { if (e.dataset.frozen === undefined) e.textContent = mmss(now - +e.dataset.t); });
    const eta = $('[data-eta]'); if (eta && ui.screen === 'home') eta.textContent = etaText(etaWindow());
    if (ui.screen === 'tracking') { const o = orderById(ui.activeId), k = o && kitchen.orders.find(x => x.id === o.id); if (o && o.status === 'cooking' && k && k.startSim) { const b = $('.hero-track .bar i'); if (b) b.style.width = Math.min(92, 35 + 55 * (now - k.startSim) / k.prepSec) + '%'; } }
  }, 500);
  $$('.seg button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
  $('#speed').addEventListener('change', e => { sim.setSpeed(+e.target.value); hint(); });
  $('#auto').addEventListener('change', e => { kitchen.auto = e.target.checked; });
  $('#btn-reset').addEventListener('click', () => { if (confirm('¿Reiniciar la demostración? Se borran los pedidos (tu perfil se mantiene).')) resetDemo(false); });
  $('#btn-results').addEventListener('click', () => resultsModal(false));
  $('#btn-test').addEventListener('click', scenarioModal);
  $('#btn-endtest').addEventListener('click', () => { if (confirm('¿Terminar la prueba sin guardar?')) endTest(); });
  addEventListener('resize', fit);
  setView(matchMedia('(max-width:560px)').matches ? 'student' : 'both');
}
boot();

</script>
